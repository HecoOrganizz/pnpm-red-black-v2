version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      frontend-runtime:
        patterns:
          - next
          - react
          - react-dom
          - next-intl
      ui-and-styling:
        patterns:
          - "@radix-ui/*"
          - lucide-react
          - framer-motion
          - tailwindcss
          - "@tailwindcss/*"
          - tailwind-merge
          - tw-animate-css
          - class-variance-authority
          - clsx
      tooling:
        patterns:
          - eslint
          - eslint-config-next
          - typescript
          - "@types/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: "Asia/Ho_Chi_Minh"
