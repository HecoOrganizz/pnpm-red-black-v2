name: CI & Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, typecheck and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24.19.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Resolve GitHub Pages URL
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          if [[ "${REPO_NAME,,}" == "${OWNER,,}.github.io" ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/${REPO_NAME}"
          fi

          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${OWNER}.github.io${BASE_PATH}" >> "$GITHUB_ENV"
          echo "Pages base path: ${BASE_PATH:-/}"
          echo "Pages URL: https://${OWNER}.github.io${BASE_PATH}/"

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build static export
        run: pnpm build

      - name: Verify Pages artifact
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -d out/en
          echo "Static export is ready."
          du -sh out

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
